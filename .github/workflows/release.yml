name: Release

# Tag pushes cut a release. `workflow_dispatch` runs the same matrix without
# publishing anything, so a change here can be rehearsed without spending a
# version number on it — the upload job is gated on actually being a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Two tags pushed in a row are two releases, not one — never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# `contents: write` is what lets the last job create the release and attach
# assets to it. Note that a repository or organisation whose default workflow
# permission is read-only cannot be widened from inside the workflow, only
# loosened by this block.
permissions:
  contents: write

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # A failure on one platform must not cancel the other three; a release
      # missing one of its four artifacts is a release nobody can install from.
      fail-fast: false
      matrix:
        include:
          # Two macOS jobs rather than one universal binary: a universal build
          # would need a `lipo` merge step, and `--target universal-apple-darwin`
          # is not something to depend on here.
          - os: macos-latest
            name: macOS arm64
            formats: dmg
            jobs: "2"
          - os: macos-15-intel
            name: macOS x86_64
            formats: dmg
            jobs: "2"
            # `macos-13` was retired in December 2025; this is the Intel runner.
          - os: ubuntu-22.04
            name: Linux x86_64
            formats: deb,appimage
            jobs: "2"
            # 22.04 (glibc 2.35), not `ubuntu-latest` (24.04, glibc 2.39): a
            # binary built against the newer glibc reports
            # `GLIBC_2.39 not found` on Debian 12 and Ubuntu 22.04. The audience
            # decides the build host, not the other way round.
          - os: windows-latest
            name: Windows x86_64
            formats: nsis
            jobs: "4"
    env:
      # A release link step is the memory high-water mark, and the macOS runners
      # have ~3 vCPU and 7 GB between them.
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev \
            libfontconfig1-dev libvulkan-dev \
            libssl-dev libsecret-1-dev libzstd-dev

      # cargo-packager runs `linuxdeploy`, and the plugin it loads in turn is
      # itself an AppImage. A CI runner has no FUSE, so tell every AppImage in
      # the chain to unpack itself instead of mounting.
      - name: Let AppImages self-extract
        if: runner.os == 'Linux'
        run: echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      # GPUI's Windows backend compiles its HLSL shaders with `fxc.exe`, and only
      # for release builds — which is exactly why this never showed up in CI
      # before. The backend searches `PATH` and then the registry; handing it a
      # path up front means a miss in either place is not a failed release.
      - name: Locate the DirectX shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } |
            Select-Object -Last 1
          if (-not $fxc) { throw "fxc.exe not found in the Windows SDK" }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV

      # cargo-packager packages a binary; it does not build one. `--locked`, like
      # everywhere else, so a release is the commit that was reviewed.
      - name: Build
        run: cargo build --release --locked -p md-app

      - name: Install cargo-packager
        # Pinned, and installed with `--locked`, so the packaging step is as
        # reproducible as the build it packages.
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Package
        # Run from the repository root: `icons` and every other path in
        # `[package.metadata.packager]` is read relative to the working
        # directory, and `cargo packager` does no canonicalising of its own.
        run: cargo packager --release --formats ${{ matrix.formats }}

      # `upload-artifact` does not preserve file modes or the symlinks inside a
      # bundle, so an `.app` uploaded on its own arrives unsigned and unusable.
      # The `.dmg` is one file and wraps the same bundle, so it is what ships.
      - name: Collect the packages
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          found=0
          for f in target/release/*.dmg target/release/*.deb \
                   target/release/*.AppImage target/release/*-setup.exe; do
            cp "$f" dist/
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::cargo packager produced no packages for '${{ matrix.formats }}'"
            exit 1
          fi
          ls -l dist

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish
    needs: package
    # `workflow_dispatch` rehearses the matrix above; only a tag publishes.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # `merge-multiple` flattens the four artifact directories into one; their
      # names are unique per platform, so nothing collides.
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          # A draft, not a published release. The assets are all built and
          # attached either way; the difference is that a person reads the page
          # before the world does. Publishing is one click.
          draft: true
          body: |
            Unsigned builds. See **Installing a release** in the README for what
            each platform will say the first time you open one.

            | Platform | Download |
            |---|---|
            | macOS (Apple silicon) | `*_aarch64.dmg` |
            | macOS (Intel) | `*_x64.dmg` |
            | Windows | `*_x64-setup.exe` |
            | Linux (Debian/Ubuntu) | `*.deb` |
            | Linux (any) | `*.AppImage` |
