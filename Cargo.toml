[workspace]
resolver = "3"
members = ["crates/md-core", "crates/md-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["aafnnp"]
repository = "https://github.com/aafnnp/md"
rust-version = "1.95"

[workspace.dependencies]
md-core = { path = "crates/md-core" }
directories = "6"
# The same Markdown parser gpui-kit's preview uses, so a table or a task list
# is the same construct in the preview and in an exported page. Version 1
# already sits in the lock file as a transitive dependency of gpui-base.
markdown = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Release profile tuned for the memory-constrained macOS arm64 CI runner
# (~7 GB RAM): thin LTO + explicit codegen-units keeps the link step from OOMing.
[profile.release]
lto = "thin"
strip = true
codegen-units = 16

[profile.dev]
codegen-units = 16
